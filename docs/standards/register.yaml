# SAH-BESS standards register — machine-readable source of truth.
#
# This file is consumed by:
#   - the Roslyn conformance analyzer (validates [Conformance(Standard=...)] IDs exist here),
#   - the Requirements Traceability Matrix (RTM) generator (standard -> code symbol -> tests).
#
# Each entry's `id` is the stable key referenced from code attributes and tests.
# `compliance` is one of: mandatory | recommended-optional | organizational.
#   - NERC CIP is the MANDATORY compliance regime.
#   - IEEE / MESA / IEC / SunSpec conformance is RECOMMENDED / OPTIONAL.
#   - Safety listings (UL / NFPA) are ORGANIZATIONAL (hardware/installation scope).
# See ADR-0009 (docs/adr/0009-regulatory-conformance.md).
#
# Editions/years are best-known at time of writing; confirm at procurement.

